services:
  db:
    image: postgres:17
    container_name: node-docker-aws-lab-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432' # porta no seu PC -> porta dentro do container
    volumes:
      - pgdata:/var/lib/postgresql/data
      # roda o init.sql automaticamente na primeira vez que o banco é criado
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
