services:
  api:
    build: .
    container_name: node-docker-aws-lab-api
    restart: unless-stopped
    init: true # repassa o SIGTERM para o Node e o container para na hora
    env_file: .env
    environment:
      PORT: 3000
      # dentro do Docker o banco é acessado pelo nome do serviço, não por localhost
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: node-docker-aws-lab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # 127.0.0.1 = só acessível de dentro da própria máquina, nunca pela internet
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # roda o init.sql automaticamente na primeira vez que o banco é criado
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
